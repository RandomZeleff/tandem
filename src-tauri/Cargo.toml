[package]
name = "tandem"
description = "Tandem — Minecraft launcher for playing together, no server needed"
version.workspace = true
edition.workspace = true

[lib]
# The `_lib` suffix avoids a lib/bin name clash on Windows (rust-lang/cargo#8519).
name = "tandem_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tandem-core = { path = "../crates/tandem-core" }
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
percent-encoding = "2"
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
tauri-plugin-dialog = "2"
